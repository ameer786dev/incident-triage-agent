[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "incident-triage-agent"
version = "0.1.0"
description = "Evidence-grounded incident triage with LangGraph, MCP, and hybrid runbook retrieval"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.26,<2",
  "numpy>=2.2,<3",
  "rank-bm25>=0.2.2,<1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pillow>=11,<13"]
neural = ["fastembed>=0.6,<1", "sentence-transformers>=4,<6"]

[project.scripts]
triage-eval = "triage_lab.evaluate:main"
triage-demo = "triage_lab.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["triage_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires external runtime (Postgres or Docker)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
